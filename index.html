<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<title>直播团队打卡</title>
<style>
:root{
  --primary:#4f46e5; --primary-dark:#4338ca; --bg:#f4f5f7; --card:#fff;
  --text:#1f2329; --muted:#8a9099; --border:#e9ebef; --green:#10b981;
  --red:#ef4444; --amber:#f59e0b; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:15px}
input,select,textarea{width:100%;border:1px solid var(--border);background:#fafbfc;border-radius:10px;padding:10px 12px;color:var(--text);outline:none;transition:.15s;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
button{outline:none;border:none;background:none;cursor:pointer;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:600;transition:.15s;border:1px solid transparent}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active{background:var(--primary-dark)}
.btn.primary:disabled{opacity:.5}
.btn.ghost{background:#fff;border-color:var(--border);color:var(--text)}
.btn.ghost:active{background:#f2f3f5}
.btn.danger{background:#fff;border-color:#fecaca;color:var(--red)}
.btn.tiny{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%;margin-top:4px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card-title{margin:0 0 12px;font-size:15px;font-weight:700}
.page{padding:12px 12px 40px;max-width:720px;margin:0 auto}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 0}
.hint{font-size:12.5px;color:var(--muted);margin:-2px 0 10px;min-height:16px}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.topbar-inner{max-width:720px;margin:0 auto;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar-title{font-weight:700;font-size:16px}
.topbar-actions{display:flex;gap:8px}
.field{margin-bottom:12px;min-width:0}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.date-line{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.date-line b{color:var(--text)}
.geo-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.geo-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;background:#f2f3f5}
.geo-icon.green{background:rgba(16,185,129,.12)}
.geo-icon.red{background:rgba(239,68,68,.12)}
.geo-icon.amber{background:rgba(245,158,11,.14)}
.geo-text{min-width:0;flex:1}
.geo-title{font-weight:700;font-size:15px}
.geo-desc{font-size:12.5px;color:var(--muted);word-break:break-all}
.geo-raw{font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center;word-break:break-all}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--border)}
.item:last-child{border-bottom:none}
.item-title{font-weight:600;font-size:14.5px}
.item-sub{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.item-right{font-weight:700;color:var(--primary);font-size:14px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat{background:#f8f9fb;border-radius:12px;padding:12px 6px}
.stat-num{font-weight:800;font-size:16px;color:var(--primary);word-break:break-all}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.tab{flex:1;text-align:center;padding:13px 0;font-size:14px;color:var(--muted);font-weight:600;position:relative}
.tab.active{color:var(--primary)}
.tab.active::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:32px;height:3px;border-radius:3px;background:var(--primary)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12.5px;background:#fafbfc}
td.num,th.num{text-align:right}
tbody tr:last-child td{border-bottom:none}
.admin-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.admin-bar input[type=month]{flex:1;padding:8px 10px;min-width:140px}
.loc-item,.person-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--border)}
.loc-item:last-child,.person-item:last-child{border-bottom:none}
.loc-name{font-weight:600;font-size:14.5px}
.loc-meta{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:#eef0ff;color:var(--primary);margin-left:6px}
.tag.off{background:#f2f3f5;color:var(--muted)}
.modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:9998}
.modal{background:#fff;border-radius:16px;padding:22px 20px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);background:rgba(17,24,39,.88);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;max-width:78vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:9999;line-height:1.45}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.bulk-info{font-size:12.5px;color:var(--muted);margin-bottom:8px;line-height:1.5}
</style>
</head>
<body>
<div id="app"><div class="loading">加载中…</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
 *  1. 配置区 —— 换成你自己的 Supabase 地址和 anon key
 * =======================================================*/
const SUPABASE_URL      = 'https://你的项目ID.supabase.co';
const SUPABASE_ANON_KEY = '你的anon_key';

const ADMIN_KEY     = '121315';
const LAST_NAME_KEY = 'lck_last_name_v1';   // 记住上次填写的姓名

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
 *  2. 工具函数
 * =======================================================*/
const app = document.getElementById('app');
const pad = n => String(n).padStart(2, '0');

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function currentMonth(){ return todayStr().slice(0,7); }
function monthRange(ym){
  const [y,m] = ym.split('-').map(Number);
  const start = `${y}-${pad(m)}-01`;
  const end   = (m === 12) ? `${y+1}-01-01` : `${y}-${pad(m+1)}-01`;
  return [start, end];
}
function fmtDuration(min){
  min = Number(min) || 0;
  const h = Math.floor(min/60), m = min % 60;
  if (h && m) return `${h}小时${m}分`;
  if (h) return `${h}小时`;
  return `${m}分钟`;
}
function hm(t){ return (t || '').slice(0,5); }
function timeToMin(t){ const [h,m] = String(t).split(':').map(Number); return h*60 + m; }
function segmentMinutes(start, end){
  let s = timeToMin(start), e = timeToMin(end);
  let d = e - s;
  if (d < 0) d += 24*60;
  return d;
}
function haversine(lat1, lng1, lat2, lng2){
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2-lat1), dLng = rad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type === 'error' ? 'rgba(190,30,30,.92)'
                     : type === 'success' ? 'rgba(6,120,80,.92)'
                     : 'rgba(17,24,39,.88)';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* =========================================================
 *  3. 全局状态
 * =======================================================*/
const state = {
  view: 'main',          // main | admin
  isAdmin: false,

  streamers: [],         // 所有直播人员
  activeStreamers: [],   // 启用中的人员（供选择）

  allLocations: [],
  locations: [],

  geo: null,
  geoStatus: 'idle',     // idle | loading | ok | out | error
  geoMsg: '',
  matched: null,

  currentStreamer: null, // 当前选中的人员 {id, name}
  myToday: [],
  myMonth: [],

  adminTab: 'data',      // data | locations | people
  adminMonth: currentMonth(),
  adminData: [],
  editingLoc: null
};

/* =========================================================
 *  4. 定位
 * =======================================================*/
function locateOnce(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation){ reject({ code: -1 }); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
      e => reject(e),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}
function geoErrMsg(e){
  if (!e) return '定位失败，请重试';
  if (e.code === 1) return '定位权限被拒绝，请在浏览器设置中允许获取位置';
  if (e.code === 2) return '无法获取位置，请检查 GPS 与网络';
  if (e.code === 3) return '定位超时，请到空旷处重试';
  if (e.code === -1) return '当前环境不支持定位（需 HTTPS 访问）';
  return '定位失败，请重试';
}
function matchLocation(lat, lng){
  let best = null;
  for (const loc of state.locations){
    if (!loc.active) continue;
    const d = haversine(lat, lng, Number(loc.lat), Number(loc.lng));
    if (d <= Number(loc.radius)){
      if (!best || d < best.distance) best = { loc, distance: d };
    }
  }
  return best;
}
async function doLocate(){
  if (state.geoStatus === 'loading') return;
  state.geoStatus = 'loading';
  renderGeoCard();
  try {
    const pos = await locateOnce();
    state.geo = pos;
    state.matched = matchLocation(pos.lat, pos.lng);
    state.geoStatus = state.matched ? 'ok' : 'out';
  } catch (e) {
    state.geoStatus = 'error';
    state.geoMsg = geoErrMsg(e);
  }
  renderGeoCard();
}

/* =========================================================
 *  5. 数据加载
 * =======================================================*/
async function loadStreamers(){
  const { data, error } = await sb.from('streamers').select('*').order('name');
  if (error){ console.warn(error); state.streamers = []; state.activeStreamers = []; return; }
  state.streamers = data || [];
  state.activeStreamers = state.streamers.filter(s => s.active);
}
async function loadLocations(){
  const { data, error } = await sb.from('locations').select('*').order('id');
  if (error){ console.warn(error); state.allLocations = []; state.locations = []; return; }
  state.allLocations = data || [];
  state.locations = state.allLocations.filter(l => l.active);
}
async function loadStreamerData(name){
  if (!name){
    state.myToday = []; state.myMonth = []; return;
  }
  const [mStart, mEnd] = monthRange(currentMonth());
  const [a, b] = await Promise.all([
    sb.from('checkins').select('*')
      .eq('user_name', name).eq('work_date', todayStr())
      .order('start_time', { ascending: true }),
    sb.from('checkins').select('*')
      .eq('user_name', name).gte('work_date', mStart).lt('work_date', mEnd)
      .order('work_date', { ascending: false })
      .order('start_time', { ascending: false })
  ]);
  state.myToday = a.data || [];
  state.myMonth = b.data || [];
}
async function loadAdminData(){
  const [start, end] = monthRange(state.adminMonth);
  const { data, error } = await sb.from('checkins')
    .select('*')
    .gte('work_date', start).lt('work_date', end)
    .order('work_date', { ascending: false })
    .order('start_time', { ascending: false });
  if (error){ toast('数据加载失败：' + error.message, 'error'); state.adminData = []; return; }
  state.adminData = data || [];
}

/* =========================================================
 *  6. 路由渲染
 * =======================================================*/
function render(){
  if (state.view === 'admin'){ renderAdmin(); return; }
  renderMain();
}

/* ---------- 6.1 主页（打卡） ---------- */
function renderMain(){
  const savedName = (() => {
    try { return localStorage.getItem(LAST_NAME_KEY) || ''; } catch(e){ return ''; }
  })();
  if (!state.currentStreamer && savedName){
    const s = state.activeStreamers.find(x => x.name === savedName);
    if (s) state.currentStreamer = { id: s.id, name: s.name };
  }

  app.innerHTML = `
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-title">🎬 直播团队打卡</div>
      <div class="topbar-actions">
        <button class="btn tiny ghost" id="btnAdmin">管理后台</button>
      </div>
    </div>
  </div>
  <main class="page">
    <section class="card" id="geoCard"></section>

    <section class="card">
      <h3 class="card-title">直播打卡</h3>
      <div class="date-line">打卡日期：<b>${todayStr()}</b></div>

      <div class="field">
        <label>直播人员姓名</label>
        <input id="streamerName" list="streamerList" autocomplete="off"
               placeholder="点击选择或输入姓名"
               value="${esc(state.currentStreamer ? state.currentStreamer.name : '')}" />
        <datalist id="streamerList">
          ${state.activeStreamers.map(s => `<option value="${esc(s.name)}"></option>`).join('')}
        </datalist>
        ${state.activeStreamers.length === 0
          ? '<div class="hint" style="color:#ef4444">⚠ 暂无可用直播人员，请联系管理员添加</div>'
          : '<div class="hint">从下拉列表中选择你的姓名</div>'}
      </div>

      <div class="grid2">
        <div class="field"><label>开始时间</label><input type="time" id="startTime" /></div>
        <div class="field"><label>结束时间</label><input type="time" id="endTime" /></div>
      </div>
      <div class="hint" id="autoHint"></div>

      <div class="grid2">
        <div class="field"><label>直播时长 · 小时</label>
          <input type="number" inputmode="numeric" id="durH" min="0" max="24" placeholder="0" /></div>
        <div class="field"><label>直播时长 · 分钟</label>
          <input type="number" inputmode="numeric" id="durM" min="0" max="59" placeholder="0" /></div>
      </div>

      <div class="field">
        <label>备注（可选）</label>
        <input id="remark" maxlength="50" placeholder="如：带货专场 / 游戏直播" />
      </div>

      <button class="btn primary block" id="btnCheckin"
        ${state.activeStreamers.length === 0 ? 'disabled' : ''}>提交打卡</button>
    </section>

    <section class="card">
      <h3 class="card-title" id="todayTitle">今日记录</h3>
      <div id="todayList"></div>
    </section>

    <section class="card">
      <h3 class="card-title" id="monthTitle">本月累计</h3>
      <div id="monthSummary"></div>
    </section>
  </main>`;

  document.getElementById('btnAdmin').onclick = askAdminKey;
  document.getElementById('btnCheckin').onclick = submitCheckin;

  const nameInput = document.getElementById('streamerName');
  nameInput.addEventListener('change', onStreamerChange);
  nameInput.addEventListener('input', () => {
    // 输入过程中仅更新 state 中当前选中的人员（不加载数据）
    const v = nameInput.value.trim();
    const s = state.activeStreamers.find(x => x.name === v);
    if (s) state.currentStreamer = { id: s.id, name: s.name };
  });

  ['startTime','endTime'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateAutoHint);
  });

  updateAutoHint();
  renderGeoCard();
  renderTodayList();
  renderMonthSummary();
}

async function onStreamerChange(e){
  const v = e.target.value.trim();
  const s = state.activeStreamers.find(x => x.name === v);
  if (!s){
    state.currentStreamer = null;
    state.myToday = []; state.myMonth = [];
    renderTodayList(); renderMonthSummary();
    return;
  }
  state.currentStreamer = { id: s.id, name: s.name };
  try { localStorage.setItem(LAST_NAME_KEY, s.name); } catch(e){}
  await loadStreamerData(s.name);
  renderTodayList();
  renderMonthSummary();
}

function updateAutoHint(){
  const el = document.getElementById('autoHint');
  if (!el) return;
  const s = document.getElementById('startTime').value;
  const e = document.getElementById('endTime').value;
  if (s && e){
    el.textContent = `按所选时段自动计算：${fmtDuration(segmentMinutes(s, e))}（跨天已自动处理）`;
  } else {
    el.textContent = '请填写实际直播时段与时长（时长为手动填写）';
  }
}

function renderGeoCard(){
  const el = document.getElementById('geoCard');
  if (!el) return;

  let icon = '📍', cls = 'gray', title = '尚未定位', desc = '提交打卡前需先完成定位';
  if (state.geoStatus === 'loading'){ icon = '⏳'; cls = 'amber'; title = '正在获取位置…'; desc = '请保持网络畅通'; }
  else if (state.geoStatus === 'ok'){ icon = '✅'; cls = 'green'; title = '已在打卡范围内'; desc = `${esc(state.matched.loc.name)} · 距离约 ${Math.round(state.matched.distance)} 米`; }
  else if (state.geoStatus === 'out'){
    icon = '⚠️'; cls = 'red'; title = '不在打卡范围内';
    let near = null;
    for (const loc of state.locations){
      const d = haversine(state.geo.lat, state.geo.lng, Number(loc.lat), Number(loc.lng));
      if (!near || d < near.d) near = { loc, d };
    }
    desc = near ? `最近打卡点「${esc(near.loc.name)}」约 ${Math.round(near.d)} 米，请靠近后重试` : '系统尚未配置打卡点，请联系管理员';
  }
  else if (state.geoStatus === 'error'){ icon = '❌'; cls = 'red'; title = '定位失败'; desc = esc(state.geoMsg); }

  el.innerHTML = `
    <div class="geo-head">
      <div class="geo-icon ${cls}">${icon}</div>
      <div class="geo-text">
        <div class="geo-title">${title}</div>
        <div class="geo-desc">${desc}</div>
      </div>
    </div>
    <button class="btn ${state.geoStatus === 'ok' ? 'ghost' : 'primary'} block" id="btnLocate"
            ${state.geoStatus === 'loading' ? 'disabled' : ''}>
      ${state.geoStatus === 'ok' ? '重新定位' : '获取当前位置'}
    </button>
    ${state.geo ? `<div class="geo-raw">坐标 ${state.geo.lat.toFixed(6)}, ${state.geo.lng.toFixed(6)}　精度 ±${Math.round(state.geo.accuracy)}m</div>` : ''}
  `;
  document.getElementById('btnLocate').onclick = doLocate;
}

function renderTodayList(){
  const el = document.getElementById('todayList');
  const titleEl = document.getElementById('todayTitle');
  if (!el) return;
  const who = state.currentStreamer ? state.currentStreamer.name : '';
  if (titleEl) titleEl.textContent = who ? `${who} · 今日记录` : '今日记录';

  if (!who){ el.innerHTML = '<div class="empty">请先选择姓名</div>'; return; }
  if (!state.myToday.length){ el.innerHTML = '<div class="empty">今天还没有打卡记录</div>'; return; }
  el.innerHTML = state.myToday.map(r => `
    <div class="item">
      <div style="min-width:0">
        <div class="item-title">${hm(r.start_time)} — ${hm(r.end_time)}</div>
        <div class="item-sub">${esc(r.location_name || '未知打卡点')}${r.remark ? ' · ' + esc(r.remark) : ''}</div>
      </div>
      <div class="item-right">${fmtDuration(r.duration_minutes)}</div>
    </div>`).join('');
}

function renderMonthSummary(){
  const el = document.getElementById('monthSummary');
  const titleEl = document.getElementById('monthTitle');
  if (!el) return;
  const who = state.currentStreamer ? state.currentStreamer.name : '';
  if (titleEl) titleEl.textContent = who ? `${who} · 本月累计` : '本月累计';

  if (!who){ el.innerHTML = '<div class="empty">请先选择姓名</div>'; return; }
  const total = state.myMonth.reduce((s, r) => s + r.duration_minutes, 0);
  const days = new Set(state.myMonth.map(r => r.work_date)).size;
  el.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-num">${fmtDuration(total)}</div><div class="stat-label">本月总时长</div></div>
      <div class="stat"><div class="stat-num">${state.myMonth.length}</div><div class="stat-label">打卡次数</div></div>
      <div class="stat"><div class="stat-num">${days}</div><div class="stat-label">打卡天数</div></div>
    </div>`;
}

/* ---------- 6.2 提交打卡 ---------- */
async function submitCheckin(){
  const nameInput = document.getElementById('streamerName');
  const name = nameInput.value.trim();
  const s = state.activeStreamers.find(x => x.name === name);
  if (!s) return toast('请从下拉列表中选择姓名', 'error');

  const sEl = document.getElementById('startTime');
  const eEl = document.getElementById('endTime');
  const hEl = document.getElementById('durH');
  const mEl = document.getElementById('durM');
  const rEl = document.getElementById('remark');

  const st = sEl.value, et = eEl.value;
  const total = (parseInt(hEl.value || 0, 10) || 0) * 60 + (parseInt(mEl.value || 0, 10) || 0);
  const remark = rEl.value.trim();

  if (!st || !et) return toast('请填写直播时段', 'error');
  if (total <= 0) return toast('请填写直播时长', 'error');
  if (total > 24 * 60) return toast('单次直播时长不能超过 24 小时', 'error');

  if (state.geoStatus === 'loading') return toast('定位中，请稍候', 'error');
  if (state.geoStatus !== 'ok' || !state.matched || !state.geo){
    return toast('请先定位并确保处于打卡范围内', 'error');
  }

  const seg = segmentMinutes(st, et);
  if (Math.abs(seg - total) > 30){
    const ok = confirm(`注意：所选时段为 ${fmtDuration(seg)}，你填写的时长为 ${fmtDuration(total)}，两者相差较大。\n\n确定要提交吗？`);
    if (!ok) return;
  }

  const btn = document.getElementById('btnCheckin');
  btn.disabled = true; btn.textContent = '提交中…';

  const { error } = await sb.from('checkins').insert({
    streamer_id: s.id,
    user_name: s.name,
    work_date: todayStr(),
    start_time: st.length === 5 ? st + ':00' : st,
    end_time: et.length === 5 ? et + ':00' : et,
    duration_minutes: total,
    lat: state.geo.lat,
    lng: state.geo.lng,
    location_id: state.matched.loc.id,
    location_name: state.matched.loc.name,
    distance_m: Math.round(state.matched.distance),
    remark: remark || null
  });

  btn.disabled = false; btn.textContent = '提交打卡';
  if (error){ toast('打卡失败：' + error.message, 'error'); return; }

  toast('打卡成功 🎉', 'success');
  sEl.value = ''; eEl.value = ''; hEl.value = ''; mEl.value = ''; rEl.value = '';
  updateAutoHint();
  await loadStreamerData(s.name);
  renderTodayList();
  renderMonthSummary();
}

/* =========================================================
 *  7. 管理员密钥验证
 * =======================================================*/
function askAdminKey(){
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal">
      <h3>管理员验证</h3>
      <p>请输入管理员密钥以进入后台</p>
      <input id="adminKeyInput" type="password" inputmode="numeric" maxlength="12" placeholder="请输入密钥" />
      <div id="adminKeyErr" style="color:#ef4444;font-size:13px;min-height:18px;margin-top:8px"></div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button class="btn ghost block" id="adminCancel">取消</button>
        <button class="btn primary block" id="adminOk">确定</button>
      </div>
    </div>`;
  document.body.appendChild(mask);
  const input = mask.querySelector('#adminKeyInput');
  const err = mask.querySelector('#adminKeyErr');
  setTimeout(() => input.focus(), 120);
  const close = () => mask.remove();

  mask.querySelector('#adminCancel').onclick = close;
  mask.querySelector('#adminOk').onclick = async () => {
    if (input.value.trim() !== ADMIN_KEY){
      err.textContent = '密钥错误，请重试';
      input.value = ''; input.focus(); return;
    }
    close();
    state.isAdmin = true;
    state.view = 'admin';
    state.adminTab = 'data';
    state.editingLoc = null;
    state.adminMonth = currentMonth();
    render();
    await loadAdminData();
    renderAdminMain();
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') mask.querySelector('#adminOk').click();
  });
}

/* ---------- 8.1 打卡数据 ---------- */
function renderAdminData(){
  const main = document.getElementById('adminMain');
  if (!main) return;
  const rows = state.adminData;

  const map = new Map();
  for (const r of rows){
    const name = r.user_name || '未知用户';
    const key = name;
    if (!map.has(key)) map.set(key, { name, count: 0, total: 0, days: new Set() });
    const o = map.get(key);
    o.count++;
    o.total += r.duration_minutes;
    o.days.add(r.work_date);
  }
  const users = [...map.values()].sort((a, b) => b.total - a.total);
  const grandTotal = rows.reduce((s, r) => s + r.duration_minutes, 0);

  main.innerHTML = `
    <section class="card">
      <div class="admin-bar">
        <input type="month" id="adminMonth" value="${state.adminMonth}" />
        <button class="btn tiny primary" id="btnExport">导出 CSV</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-num">${fmtDuration(grandTotal)}</div><div class="stat-label">本月总时长</div></div>
        <div class="stat"><div class="stat-num">${users.length}</div><div class="stat-label">打卡人数</div></div>
        <div class="stat"><div class="stat-num">${rows.length}</div><div class="stat-label">记录条数</div></div>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">按人员汇总（本月）</h3>
      ${users.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>姓名</th><th class="num">打卡次数</th><th class="num">打卡天数</th><th class="num">总时长</th></tr></thead>
          <tbody>
            ${users.map(u => `<tr>
              <td>${esc(u.name)}</td>
              <td class="num">${u.count}</td>
              <td class="num">${u.days.size}</td>
              <td class="num"><b>${fmtDuration(u.total)}</b></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : '<div class="empty">本月暂无打卡数据</div>'}
    </section>

    <section class="card">
      <h3 class="card-title">打卡明细</h3>
      ${rows.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>姓名</th><th>直播时段</th><th class="num">时长</th><th>打卡点</th><th>备注</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td>${esc(r.work_date)}</td>
              <td>${esc(r.user_name || '-')}</td>
              <td>${hm(r.start_time)} - ${hm(r.end_time)}</td>
              <td class="num">${fmtDuration(r.duration_minutes)}</td>
              <td>${esc(r.location_name || '-')}</td>
              <td>${esc(r.remark || '-')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : '<div class="empty">本月暂无打卡数据</div>'}
    </section>`;

  document.getElementById('adminMonth').onchange = async (e) => {
    state.adminMonth = e.target.value || currentMonth();
    await loadAdminData();
    renderAdminData();
  };
  document.getElementById('btnExport').onclick = exportCSV;
}

function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV(){
  const rows = state.adminData;
  if (!rows.length) return toast('当前月份没有数据可导出', 'error');
  const header = ['日期','姓名','开始时间','结束时间','直播时长(分钟)','直播时长','打卡地点','距离(米)','备注'];
  const lines = [header.join(',')];
  for (const r of rows){
    lines.push([
      r.work_date, csvCell(r.user_name || ''), hm(r.start_time), hm(r.end_time),
      r.duration_minutes, csvCell(fmtDuration(r.duration_minutes)),
      csvCell(r.location_name || ''), r.distance_m == null ? '' : r.distance_m,
      csvCell(r.remark || '')
    ].join(','));
  }
  const content = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `直播打卡_${state.adminMonth}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('已导出', 'success');
}

/* ---------- 8.2 打卡点管理 ---------- */
function renderAdminLocations(){
  const main = document.getElementById('adminMain');
  if (!main) return;
  const list = state.allLocations;
  const ed = state.editingLoc;

  main.innerHTML = `
    <section class="card">
      <h3 class="card-title">${ed ? '编辑打卡点' : '新增打卡点'}</h3>
      <div class="field"><label>打卡点名称</label>
        <input id="locName" placeholder="如：公司 3 楼直播间" value="${ed ? esc(ed.name) : ''}" /></div>
      <div class="grid2">
        <div class="field"><label>纬度 lat</label>
          <input id="locLat" type="number" step="0.000001" placeholder="36.123456" value="${ed ? ed.lat : ''}" /></div>
        <div class="field"><label>经度 lng</label>
          <input id="locLng" type="number" step="0.000001" placeholder="116.123456" value="${ed ? ed.lng : ''}" /></div>
      </div>
      <div class="field"><label>有效半径（米）</label>
        <input id="locRadius" type="number" min="30" max="10000" value="${ed ? ed.radius : 300}" /></div>
      <div class="grid2">
        <button class="btn ghost block" id="btnUseGeo">用当前位置填充</button>
        <button class="btn primary block" id="btnSaveLoc">${ed ? '保存修改' : '添加打卡点'}</button>
      </div>
      ${ed ? '<button class="btn ghost block" id="btnCancelEdit">取消编辑</button>' : ''}
    </section>

    <section class="card">
      <h3 class="card-title">已有打卡点（${list.length}）</h3>
      ${list.length ? list.map(l => `
        <div class="loc-item">
          <div style="min-width:0">
            <div class="loc-name">${esc(l.name)} ${l.active ? '' : '<span class="tag off">已停用</span>'}</div>
            <div class="loc-meta">${Number(l.lat).toFixed(6)}, ${Number(l.lng).toFixed(6)} · 半径 ${l.radius} 米</div>
          </div>
          <div style="display:flex;gap:6px;flex:0 0 auto">
            <button class="btn tiny ghost" data-act="toggle" data-id="${l.id}">${l.active ? '停用' : '启用'}</button>
            <button class="btn tiny ghost" data-act="edit" data-id="${l.id}">编辑</button>
            <button class="btn tiny ghost" data-act="del" data-id="${l.id}" style="color:#ef4444">删除</button>
          </div>
        </div>`).join('') : '<div class="empty">还没有配置打卡点</div>'}
    </section>`;

  document.getElementById('btnUseGeo').onclick = async () => {
    const btn = document.getElementById('btnUseGeo');
    btn.disabled = true; btn.textContent = '定位中…';
    try {
      const pos = await locateOnce();
      document.getElementById('locLat').value = pos.lat.toFixed(6);
      document.getElementById('locLng').value = pos.lng.toFixed(6);
      toast('已填入当前坐标', 'success');
    } catch (e){ toast(geoErrMsg(e), 'error'); }
    btn.disabled = false; btn.textContent = '用当前位置填充';
  };

  document.getElementById('btnSaveLoc').onclick = saveLocation;
  const cancel = document.getElementById('btnCancelEdit');
  if (cancel) cancel.onclick = () => { state.editingLoc = null; renderAdminLocations(); };
  main.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = () => handleLocAction(btn.dataset.act, Number(btn.dataset.id));
  });
}

async function saveLocation(){
  const name = document.getElementById('locName').value.trim();
  const lat = parseFloat(document.getElementById('locLat').value);
  const lng = parseFloat(document.getElementById('locLng').value);
  const radius = parseInt(document.getElementById('locRadius').value || '300', 10);

  if (!name) return toast('请填写打卡点名称', 'error');
  if (!isFinite(lat) || !isFinite(lng)) return toast('请填写正确的经纬度', 'error');
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return toast('经纬度超出范围', 'error');
  if (!(radius >= 30 && radius <= 10000)) return toast('半径建议 30 ~ 10000 米', 'error');

  const payload = { name, lat, lng, radius };
  let error;
  if (state.editingLoc){ ({ error } = await sb.from('locations').update(payload).eq('id', state.editingLoc.id)); }
  else { ({ error } = await sb.from('locations').insert({ ...payload, active: true })); }
  if (error) return toast('保存失败：' + error.message, 'error');

  toast('已保存', 'success');
  state.editingLoc = null;
  await loadLocations();
  renderAdminLocations();
}

async function handleLocAction(act, id){
  const loc = state.allLocations.find(l => l.id === id);
  if (!loc) return;
  if (act === 'edit'){ state.editingLoc = loc; renderAdminLocations(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (act === 'toggle'){
    const { error } = await sb.from('locations').update({ active: !loc.active }).eq('id', id);
    if (error) return toast('操作失败：' + error.message, 'error');
    await loadLocations(); renderAdminLocations(); return;
  }
  if (act === 'del'){
    if (!confirm(`确定删除打卡点「${loc.name}」吗？`)) return;
    const { error } = await sb.from('locations').delete().eq('id', id);
    if (error) return toast('删除失败：' + error.message, 'error');
    toast('已删除', 'success');
    await loadLocations(); renderAdminLocations();
  }
}

/* ---------- 8.3 直播人员名单管理 ---------- */
function renderAdminPeople(){
  const main = document.getElementById('adminMain');
  if (!main) return;
  const list = state.streamers;

  main.innerHTML = `
    <section class="card">
      <h3 class="card-title">添加单个人员</h3>
      <div class="grid2">
        <input id="newPersonName" placeholder="输入姓名" maxlength="20" />
        <button class="btn primary" id="btnAddPerson">添加</button>
      </div>
      <div class="hint" id="addPersonHint"></div>
    </section>

    <section class="card">
      <h3 class="card-title">批量导入</h3>
      <div class="bulk-info">
        每行一个姓名，例如：<br>
        张三<br>
        李四<br>
        王五<br>
        重复姓名会自动跳过
      </div>
      <textarea id="bulkNames" placeholder="张三&#10;李四&#10;王五"></textarea>
      <button class="btn primary block" id="btnBulkImport" style="margin-top:10px">导入名单</button>
    </section>

    <section class="card">
      <h3 class="card-title">名单（${list.length} 人，启用 ${list.filter(s=>s.active).length} 人）</h3>
      ${list.length ? list.map(s => `
        <div class="person-item">
          <div style="min-width:0">
            <div class="loc-name">${esc(s.name)} ${s.active ? '' : '<span class="tag off">已停用</span>'}</div>
          </div>
          <div style="display:flex;gap:6px;flex:0 0 auto">
            <button class="btn tiny ghost" data-act="toggle" data-id="${s.id}">${s.active ? '停用' : '启用'}</button>
            <button class="btn tiny ghost" data-act="del" data-id="${s.id}" style="color:#ef4444">删除</button>
          </div>
        </div>`).join('') : '<div class="empty">暂无人员，请添加或导入</div>'}
    </section>`;

  document.getElementById('btnAddPerson').onclick = async () => {
    const input = document.getElementById('newPersonName');
    const name = input.value.trim();
    if (!name) return toast('请输入姓名', 'error');
    if (name.length > 20) return toast('姓名过长', 'error');
    const { error } = await sb.from('streamers').insert({ name, active: true });
    if (error){
      if (error.code === '23505') return toast('该姓名已存在', 'error');
      return toast('添加失败：' + error.message, 'error');
    }
    input.value = '';
    toast('已添加', 'success');
    await loadStreamers();
    renderAdminPeople();
  };

  document.getElementById('btnBulkImport').onclick = async () => {
    const ta = document.getElementById('bulkNames');
    const lines = ta.value.split(/\r?\n/).map(x => x.trim()).filter(x => x.length > 0);
    if (!lines.length) return toast('请粘贴要导入的姓名', 'error');

    const unique = [...new Set(lines)];
    const existingNames = new Set(state.streamers.map(s => s.name));
    const toInsert = unique.filter(n => !existingNames.has(n)).map(n => ({ name: n, active: true }));

    if (!toInsert.length){
      toast('全部姓名已存在，无新增', 'info');
      return;
    }
    const { error } = await sb.from('streamers').insert(toInsert);
    if (error) return toast('导入失败：' + error.message, 'error');

    ta.value = '';
    toast(`成功导入 ${toInsert.length} 人（跳过重复 ${unique.length - toInsert.length} 人）`, 'success');
    await loadStreamers();
    renderAdminPeople();
  };

  main.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = () => handlePersonAction(btn.dataset.act, Number(btn.dataset.id));
  });
}

async function handlePersonAction(act, id){
  const s = state.streamers.find(x => x.id === id);
  if (!s) return;
  if (act === 'toggle'){
    const { error } = await sb.from('streamers').update({ active: !s.active }).eq('id', id);
    if (error) return toast('操作失败：' + error.message, 'error');
    await loadStreamers();
    renderAdminPeople();
    return;
  }
  if (act === 'del'){
    if (!confirm(`确定删除「${s.name}」吗？\n历史打卡记录不会受影响。`)) return;
    const { error } = await sb.from('streamers').delete().eq('id', id);
    if (error) return toast('删除失败：' + error.message, 'error');
    toast('已删除', 'success');
    await loadStreamers();
    renderAdminPeople();
  }
}

/* =========================================================
 *  9. 启动
 * =======================================================*/
async function boot(){
  try {
    await Promise.all([loadStreamers(), loadLocations()]);
  } catch (e){
    console.error(e);
  }
  render();
}
boot();
